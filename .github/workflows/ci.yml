name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are the four versions pyproject's classifiers claim, so this
        # matrix is what keeps that claim honest rather than aspirational.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The one runtime dependency is the sibling gtfs-validator, resolved
      # from PyPI by version, so this needs no credentials and no git.
      - name: Install
        run: python -m pip install -e ".[dev]"

      # No JDK and no jar on this runner, so every differential test skips
      # rather than fails; `tools/jarenv.py:jar_present` is what they gate on
      # and `-ra` in pyproject prints the reason for each one. Building
      # upstream's jar in CI is a separate decision and is deliberately not
      # made here.
      - name: pytest
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      # Pinned exactly rather than to the `ruff>=0.6` the dev extra allows.
      # Formatting output changes between ruff releases, so an unpinned
      # `ruff format --check` turns a new release into a red build on code
      # nobody touched.
      - name: Install ruff
        run: python -m pip install ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  file-size:
    name: file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The same limit the local PostToolUse hook enforces on every write: no
      # hand-written file over 300 lines. `proto/schema_*.py` is exempt because
      # it is generated by tools/gen_schema_*.py and is not hand-edited, which
      # is the same reason the hook's advice about splitting by concern does
      # not apply to it.
      - name: No hand-written file over 300 lines
        run: |
          limit=300
          over=$(git ls-files '*.py' \
            | grep -v '^src/gtfs_rt_validator/proto/schema_' \
            | xargs wc -l \
            | awk -v limit="$limit" '$2 != "total" && $1 > limit {print $1 " " $2}')
          if [ -n "$over" ]; then
            echo "Files over $limit lines:"
            echo "$over"
            exit 1
          fi
          echo "No hand-written file exceeds $limit lines."
